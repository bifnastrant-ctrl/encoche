name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: encoche
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Encoche-Setup
          path: encoche/dist/EncocheSetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Encoche-exe
          path: encoche/build/Release/Encoche.exe
